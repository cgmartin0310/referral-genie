databases:
  - name: referral-genie-db
    databaseName: referral_genie
    user: referral_genie_user
    region: oregon # or your preferred region

services:
  - type: web
    name: referral-genie
    runtime: node
    region: oregon # should match your database region
    buildCommand: npm install && npm test && npm run build && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: referral-genie-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: HUMBLE_FAX_API_KEY
        sync: false # You'll set this in Render dashboard
      - key: HUMBLE_FAX_API_SECRET
        sync: false # You'll set this in Render dashboard
      - key: HUMBLE_FAX_API_URL
        value: https://api.humblefax.com
      - key: HUMBLE_FAX_WEBHOOK_URL
        sync: false # You'll set this after deployment
      - key: HUMBLE_FAX_WEBHOOK_SECRET
        sync: false # Optional. When set, the fax webhook requires ?secret=<value> or X-Webhook-Secret.
      - key: GOOGLE_PLACES_API_KEY
        sync: false # You'll set this in Render dashboard
      - key: DEFAULT_FAX_NUMBER
        value: 19103974373 # Default display fax number for cover sheets
      - key: NEXTAUTH_SECRET
        generateValue: true # Generates a random secret
      - key: NEXTAUTH_URL
        sync: false # Set to https://your-app-name.onrender.com
      - key: AUTH_USERNAME
        sync: false # Required. Login is rejected when this is unset.
      - key: AUTH_PASSWORD
        sync: false # Required. Login is rejected when this is unset.
      - key: XAI_API_KEY
        sync: false # Preferred research model key (Grok). GROK_API_KEY is also accepted.
      - key: XAI_MODEL
        sync: false # Optional. Defaults to grok-4.
      - key: OPENAI_COMPAT_API_KEY
        sync: false # Used for research only when XAI_API_KEY and GROK_API_KEY are unset.
      - key: OPENAI_COMPAT_BASE_URL
        sync: false # OpenAI-compatible base URL, for example https://api.openai.com/v1
      - key: OPENAI_COMPAT_MODEL
        sync: false # Model name for OPENAI_COMPAT_BASE_URL. 